<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo | Imperium Eventos</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #fdfafb; margin: 0; padding: 20px; }
        header { background: #6b001a; color: white; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display:flex; justify-content:space-between; align-items:center; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        h1 { margin: 0; font-size: 1.5rem; color: #d4af37; }
        .acciones-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; font-size: 0.88rem; }
        th { background: #6b001a; color: white; }
        tr:hover { background: #f8f9fa; }
        .badge-pago { background: #27ae60; color: white; padding: 4px 8px; border-radius: 12px; font-size: 0.78rem; font-weight: bold; }
        .badge-monto { background: #2980b9; color: white; padding: 3px 6px; border-radius: 4px; font-weight: bold; }
        .btn-link { color: #6b001a; font-weight: bold; text-decoration: none; }
        .btn-volver { background: #d4af37; color: black; padding: 0.5rem 1rem; border-radius: 20px; text-decoration: none; font-weight: bold; transition: background 0.3s; }
        .btn-volver:hover { background: #f1c40f; }
        .btn-borrar { background: #e74c3c; color: white; border: none; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1><i class="fa-solid fa-user-shield"></i> IMPERIUM - Control de Pagos y Reservas</h1>
        <a href="../index.html" class="btn-volver"><i class="fa-solid fa-house"></i> Volver a la Web</a>
    </header>

    <div class="acciones-bar">
        <h2><i class="fa-solid fa-file-invoice-dollar"></i> Lista de Eventos y Verificación de Pagos</h2>
        <button onclick="limpiarReservas()" class="btn-borrar"><i class="fa-solid fa-trash"></i> Limpiar Historial</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Voucher</th>
                <th>Cliente</th>
                <th>Contacto</th>
                <th>Evento / Fecha</th>
                <th>Servicio / Catering</th>
                <th>Monto Total / Pagado</th>
                <th>Medio de Pago</th>
                <th>Ubicación</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody id="tablaReservas">
            <!-- Se cargan dinámicamente desde el localStorage -->
        </tbody>
    </table>

    <script>
        function cargarReservas() {
            const tabla = document.getElementById('tablaReservas');
            const reservas = JSON.parse(localStorage.getItem('reservas_imperium')) || [];

            if (reservas.length === 0) {
                tabla.innerHTML = `<tr><td colspan="9" style="text-align:center; padding: 2rem; color: #666;">
                    <i class="fa-solid fa-folder-open" style="font-size:2rem; margin-bottom:0.5rem; display:block;"></i>
                    No hay registros de pago en el sistema todavía. Realiza una reserva desde la página principal.
                </td></tr>`;
                return;
            }

            let html = '';
            reservas.forEach(r => {
                html += `<tr>
                    <td><strong>${r.voucher}</strong></td>
                    <td>${r.nombre}</td>
                    <td>${r.telefono}<br><small>${r.email}</small></td>
                    <td>${r.tipo_evento}<br><small>${r.fecha_evento}</small></td>
                    <td>${r.cantidad_platos}x ${r.plato_catering}<br><small>${r.animadores}</small></td>
                    <td>Total: ${r.monto_total || 'S/ 0'}<br><span class="badge-monto">Depositó: ${r.monto_pagado || 'S/ 0'}</span></td>
                    <td>${r.metodo_pago || 'Yape'}<br><small>${r.detalle_pago || ''}</small></td>
                    <td><a href="${r.coords_gps || '#'}" target="_blank" class="btn-link"><i class="fa-solid fa-map-location-dot"></i> Ver Mapa</a></td>
                    <td><span class="badge-pago">${r.estado || 'ADELANTO PAGADO'}</span></td>
                </tr>`;
            });

            tabla.innerHTML = html;
        }

        function limpiarReservas() {
            if (confirm("¿Deseas borrar todo el historial de reservas para realizar nuevas pruebas de pago?")) {
                localStorage.removeItem('reservas_imperium');
                cargarReservas();
            }
        }

        document.addEventListener("DOMContentLoaded", cargarReservas);
    </script>

</body>
</html>
